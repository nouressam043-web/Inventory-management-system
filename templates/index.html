<!DOCTYPE html>
<html>
<head>
    <title> Inventory Dashboard</title>
    <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">
</head>
<body>
    <div class="page-container">
        <h1> Inventory Dashboard</h1>
        <a href="/add_item" class="btn">Add Item</a>
        <a href="/reports" class="btn">Reports</a>
        <table>
            <tr><th>ID</th><th>Name</th><th>Quantity</th><th>Actions</th></tr>
        {% for item in items %}
        <tr>
            <td>{{ item[0] }}</td>
            <td>{{ item[1] }}</td>
            <td>{{ item[2] }}</td>
            <td>
                <a href="/edit/{{ item[0]}}" class="edit-btn">Edit</a>
                <a href="/delete/{{ item[0] }}" class="delete-btn">Remove</a>
            </td>

        </tr>
        {% endfor %}
    </table>
</body>
</html>
